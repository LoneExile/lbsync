name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Clean two-architecture index (no unknown/unknown manifests).
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The runtime image is FROM scratch with no shell and no /tmp. If it were
      # missing its binary, its CA bundle, or could not transfer, nothing would
      # notice until the weekly CronJob first fired at 05:30 — this makes the
      # failure happen here instead. Built separately for the local arch because
      # a multi-platform build cannot be --load-ed.
      - name: Smoke test the image
        env:
          IMAGE: lbsync:smoke
        run: |
          docker buildx build --platform linux/amd64 --load -t "$IMAGE" .
          set +e
          out="$(docker run --rm "$IMAGE" 2>&1)"
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 1 ] || { echo "expected exit 1 for missing config, got $rc"; exit 1; }
          case "$out" in
            *"missing required environment"*) echo "ok: image starts, links and reports missing config" ;;
            *) echo "unexpected output from the image"; exit 1 ;;
          esac
